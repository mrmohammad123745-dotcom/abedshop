<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات محصول</title>

<link rel="stylesheet" href="style.css">

<style>

.product-page{
    padding:60px 0;
}

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    background:#0f1d3a;
    border:1px solid rgba(212,175,55,.2);
    border-radius:25px;
    padding:30px;
}

.product-gallery img{
    width:100%;
    border-radius:20px;
}

.product-info h1{
    margin-bottom:15px;
}

.product-price{
    color:#d4af37;
    font-size:32px;
    font-weight:800;
    margin:20px 0;
}

.product-rating{
    color:#ffd700;
    margin-bottom:15px;
}

.features{
    margin:25px 0;
}

.features li{
    margin:10px 0;
}

.whatsapp-btn{
    display:inline-block;
    padding:15px 30px;
    background:#25D366;
    color:#fff;
    border-radius:15px;
    font-weight:bold;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    color:#fff;
}

.similar-products{
    margin-top:80px;
}

.similar-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.similar-card{
    background:#0f1d3a;
    border-radius:20px;
    overflow:hidden;
}

.similar-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.similar-card h3{
    padding:15px;
}

.customer-box{
    margin-top:60px;
    background:#0f1d3a;
    padding:25px;
    border-radius:20px;
}

.customer-box p{
    margin-bottom:15px;
}

@media(max-width:900px){

.product-detail{
grid-template-columns:1fr;
}

.similar-grid{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="container product-page">

<div id="productContainer"></div>

<div class="similar-products">

<h2 style="margin-bottom:25px">محصولات مشابه</h2>

<div class="similar-grid" id="similarProducts"></div>

</div>

<div class="customer-box">

<h2>نظرات مشتریان</h2>

<p>⭐⭐⭐⭐⭐ محصول عالی بود دقیقا همونی بود که انتظار داشتم.</p>

<p>⭐⭐⭐⭐⭐ کیفیت ساخت خیلی خوبه و بسته‌بندی حرفه‌ای بود.</p>

<p>⭐⭐⭐⭐⭐ خیلی سریع به دستم رسید، ممنون از فروشگاه.</p>

</div>

</div>

<script src="products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

const product = products.find(p => p.id === id);

if(product){

document.getElementById("productContainer").innerHTML = `

<div class="product-detail">

<div class="product-gallery">

<img src="${product.image}" alt="${product.name}">

</div>

<div class="product-info">

<span class="product-category">${product.category}</span>

<h1>${product.name}</h1>

<div class="product-rating">
⭐ ${product.rating}
</div>

<p>${product.description}</p>

<div class="product-price">
${product.price.toLocaleString("fa-IR")} تومان
</div>

<ul class="features">

<li>✅ تضمین اصالت کالا</li>

<li>✅ ارسال سریع به سراسر کشور</li>

<li>✅ پشتیبانی قبل و بعد از خرید</li>

<li>✅ پرداخت امن</li>

</ul>

<a
class="whatsapp-btn"
target="_blank"
href="https://wa.me/989904438303?text=سلام، درباره محصول ${product.name} سوال دارم">
سفارش در واتساپ
</a>

<br>

<a href="index.html" class="back-btn">
← بازگشت به فروشگاه
</a>

</div>

</div>

`;

}

const similar = products
.filter(p => p.id !== id)
.slice(0,3);

document.getElementById("similarProducts").innerHTML =
similar.map(p => `

<div class="similar-card">

<img src="${p.image}">

<h3>${p.name}</h3>

</div>

`).join("");

</script>

</body>
</html>
